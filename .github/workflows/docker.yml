name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rafifmsn/celerum
  PACKAGE: celerum

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          SIZE_BYTES=$(docker buildx imagetools inspect "${{ env.IMAGE }}:latest" --raw | jq '[.manifests[]?.size // 0, .config.size // 0, (.layers[]?.size // 0)] | add')
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES:-0} / 1048576}")
          echo "### Image Size (${{ env.PACKAGE }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compressed manifest size: ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old versions (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(gh api --paginate "/user/packages/container/${{ env.PACKAGE }}/versions" \
            --jq 'sort_by(.created_at) | reverse | .[3:][].id' 2>/dev/null || true)
          for id in $IDS; do
            gh api -X DELETE "/user/packages/container/${{ env.PACKAGE }}/versions/${id}" || true
          done
